apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    # TODO 1 (resuelto): uso el FQDN del Service `redis-master` que crea el chart
    # de Bitnami en el namespace `redis`. Apunto al master (y no a redis-replicas)
    # porque Redis Streams requiere escrituras (XADD) y las réplicas son de solo lectura.
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

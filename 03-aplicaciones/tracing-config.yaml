# ---------------------------------------------------------------------------
# Configuración de observabilidad para los sidecars de la PoC
# ---------------------------------------------------------------------------
# En la primera ejecución el atributo `traceparent` llegaba vacío al subscriber,
# porque la configuración por defecto de Dapr no muestrea trazas. Con
# samplingRate "1" (100%) obligo al sidecar a generar un contexto W3C Trace
# Context por cada publicación y a propagarlo dentro del sobre CloudEvents.
#
# No configuro un exporter (Zipkin/OTLP) porque en este lab solo me interesa
# la propagación del contexto; en producción agregaría `spec.tracing.otel`
# apuntando a un OpenTelemetry Collector y bajaría el samplingRate.
#
# Referencia: https://docs.dapr.io/operations/observability/tracing/setup-tracing/
# ---------------------------------------------------------------------------
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: tracing-config
  namespace: default
spec:
  tracing:
    samplingRate: "1"

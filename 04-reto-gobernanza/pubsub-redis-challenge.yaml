apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

    # ---------------------------------------------------------------------------
    # TODO 1: Configurar Time-to-Live (TTL) para los mensajes
    # ---------------------------------------------------------------------------
    # Agrega una entrada de metadata para que los mensajes expiren
    # automáticamente después de 120 segundos.
    #
    # Referencia: https://docs.dapr.io/developing-applications/building-blocks/pubsub/pubsub-message-ttl/
    # ---------------------------------------------------------------------------
    # Resuelto, con un hallazgo de la verificación:
    # Declaro aquí la política de 120 s, como pide el reto. Sin embargo, en mis
    # pruebas con Dapr 1.19 + Redis, este valor a nivel de componente NO se
    # aplicó: el CloudEvent se guardó sin el atributo `expiration` y el mensaje
    # se entregó a los 130 s. Redis no tiene TTL nativo por mensaje, así que
    # Dapr lo implementa en el runtime solo cuando el TTL viaja como metadata de
    # la publicación (`metadata.ttlInSeconds`). Por eso la política efectiva la
    # hago cumplir con la variable ORDER_TTL_SECONDS del publisher-job.yaml.
    # Detallo el experimento en reflexion-arquitectonica.md.
    - name: ttlInSeconds
      value: "120"

    # ---------------------------------------------------------------------------
    # TODO 2: Configurar Consumer Group con Namespace para Multi-Tenancy
    # ---------------------------------------------------------------------------
    # Agrega una entrada de metadata para el consumerID que incluya el
    # marcador {namespace} de Dapr, de modo que cada namespace de Kubernetes
    # use un consumer group distinto en Redis.
    #
    # Referencia: https://docs.dapr.io/operations/components/component-scopes/#namespaced-components
    # ---------------------------------------------------------------------------
    # Resuelto: combino {appID} y {namespace} para que el consumer group sea,
    # por ejemplo, `order-subscriber-checkout` y `order-subscriber-inventory`.
    # Así cada namespace obtiene su propio grupo en el stream de Redis y recibe
    # el 100% de los eventos, mientras que las réplicas dentro de un mismo
    # namespace siguen compartiendo grupo (competing consumers).
    - name: consumerID
      value: "{appID}-{namespace}"

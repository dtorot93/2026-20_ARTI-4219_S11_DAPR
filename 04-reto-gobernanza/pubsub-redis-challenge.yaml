apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

    # ---------------------------------------------------------------------------
    # TODO 1: Configurar Time-to-Live (TTL) para los mensajes
    # ---------------------------------------------------------------------------
    # Agrega una entrada de metadata para que los mensajes expiren
    # automáticamente después de 120 segundos.
    #
    # Referencia: https://docs.dapr.io/developing-applications/building-blocks/pubsub/pubsub-message-ttl/
    # ---------------------------------------------------------------------------
    - name: ttlInSeconds
      value: "120"

    # ---------------------------------------------------------------------------
    # TODO 2: Configurar Consumer Group con Namespace para Multi-Tenancy
    # ---------------------------------------------------------------------------
    # Agrega una entrada de metadata para el consumerID que incluya el
    # marcador {namespace} de Dapr, de modo que cada namespace de Kubernetes
    # use un consumer group distinto en Redis.
    #
    # Referencia: https://docs.dapr.io/operations/components/component-scopes/#namespaced-components
    # ---------------------------------------------------------------------------
    - name: consumerID
      value: "{appID}-{namespace}"
